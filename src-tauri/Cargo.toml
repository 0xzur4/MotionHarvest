[package]
name = "motionharvest-studio"
version = "1.0.0"
description = "MotionHarvest Studio — Free Full Edition local-first full-performance mocap harvester"
authors = ["MotionHarvest Studio"]
edition = "2021"

[lib]
name = "motionharvest_studio_lib"
crate-type = ["rlib"]

[[bin]]
name = "motionharvest-studio"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
glam = { version = "0.29", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "charset"] }
futures-util = "0.3"
thiserror = "2"
dirs = "6"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
